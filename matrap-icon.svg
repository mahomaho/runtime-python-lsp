<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Runtime-Aware Python</title>
  <desc>VS Code extension icon for MATrap: a stylized Python coil with a debug-pause cue and a live-signal pulse.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f1f33"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="256" height="256" rx="48"/>
    </clipPath>
  </defs>

  <!-- background tile -->
  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bgGrad)"/>

  <g clip-path="url(#iconClip)">
    <!-- upper python wedge (blue) -->
    <path d="M 128 56
             Q 72 56 72 112
             L 72 147
             L 163 147
             L 163 165
             L 44 165
             Q 27 165 27 189
             L 27 217
             Q 27 245 58 245
             L 93 245
             L 93 217
             Q 93 193 117 193
             L 191 193
             Q 219 193 219 165
             L 219 98
             Q 219 56 163 56 Z"
            fill="#4584b6"/>
    <!-- upper eye dot -->
    <circle cx="106" cy="91" r="9" fill="#ffd43b"/>

    <!-- lower python wedge (yellow) -->
    <path d="M 128 280
             Q 184 280 184 224
             L 184 189
             L 93 189
             L 93 171
             L 212 171
             Q 229 171 229 147
             L 229 119
             Q 229 91 198 91
             L 163 91
             L 163 119
             Q 163 143 139 143
             L 65 143
             Q 37 143 37 171
             L 37 238
             Q 37 280 93 280 Z"
            fill="#ffd43b"/>
    <!-- lower eye dot -->
    <circle cx="150" cy="245" r="9" fill="#4584b6"/>

    <!-- pause bars — the "debug paused" cue -->
    <rect x="160" y="160" width="20" height="54" rx="4" fill="#ffffff"/>
    <rect x="191" y="160" width="20" height="54" rx="4" fill="#ffffff"/>

    <!-- live signal pulse — "runtime-aware" -->
    <circle cx="220" cy="40" r="14" fill="#0f1f33"/>
    <circle cx="220" cy="40" r="9" fill="#4ade80"/>
  </g>
</svg>
